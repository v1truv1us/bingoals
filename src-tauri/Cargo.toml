[package]
name = "bingoals"
version = "0.1.0"
description = "Goal tracking bingo board"
authors = ["johnferguson"]
edition = "2021"

[lib]
name = "bingoals_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["wry"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "z"

[profile.release.package."*"]
inherits = "release"
codegen-units = 1

[[bin]]
name = "bingoals"
path = "src/main.rs"

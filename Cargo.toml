[package]
name = "bingoals"
version = "0.1.0"
description = "Goal tracking bingo board"
authors = ["johnferguson"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
tauri-codegen = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["wry"] }

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "z"

[profile.release.package."*"]
inherits = "release"
codegen-units = 1

[[bin]]
name = "bingoals"
path = "src/main.rs"